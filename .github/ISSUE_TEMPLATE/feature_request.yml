name: Feature request
description: Suggest an improvement or a new integration
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Не публикуйте токены, ключи, ссылки подписок и данные клиентов. / Please do not paste tokens, keys, subscription links or customer data.
  - type: textarea
    id: problem
    attributes:
      label: Проблема / The problem
      description: Что вы пытаетесь сделать, а сейчас это сложно или невозможно? / What are you trying to do that is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Предлагаемое решение / Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Рассмотренные альтернативы / Alternatives considered
  - type: textarea
    id: links
    attributes:
      label: Ссылки / Links
      description: Документация API новой панели или платёжной системы, если применимо. / API documentation for a new panel or payment provider, if relevant.
