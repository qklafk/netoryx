name: Feature request
description: Suggest an improvement or a new integration
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste tokens, keys, subscription links or customer data.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: links
    attributes:
      label: Links
      description: API documentation for a new panel or payment provider, if relevant.
