name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches pyproject.toml
        run: |
          python3 - <<'PY'
          import os, re, tomllib
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          norm = lambda v: re.sub(r"[-.]?(beta|b)[-.]?(\d*)", lambda m: "b" + (m.group(2) or "0"), v)
          if norm(tag) != norm(version):
              raise SystemExit(f"tag {tag} does not match pyproject version {version}")
          PY
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/qklafk/netoryx
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=beta,enable=${{ contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    runs-on: ubuntu-24.04
    needs: image
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Extract release notes from CHANGELOG.md
        run: |
          python3 - <<'PY'
          import os, re
          tag = os.environ["GITHUB_REF_NAME"]
          version = tag.lstrip("v")
          notes = ""
          try:
              text = open("CHANGELOG.md", encoding="utf-8").read()
              match = re.search(
                  r"^## \[" + re.escape(version) + r"\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.S | re.M
              )
              if match:
                  notes = match.group(1).strip()
          except OSError:
              pass
          if not notes:
              print(f"::warning::no CHANGELOG.md section for {version}; using a generic note")
              notes = f"Release {tag}. See the commit history for changes."
          open("release-notes.md", "w", encoding="utf-8").write(notes + "\n")
          PY
      - name: Build source archive
        run: git archive --format=tar.gz --prefix="netoryx-${GITHUB_REF_NAME#v}/" -o "netoryx-${GITHUB_REF_NAME#v}.tar.gz" "$GITHUB_REF_NAME"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=()
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" "netoryx-${GITHUB_REF_NAME#v}.tar.gz" \
            --title "Netoryx ${GITHUB_REF_NAME#v}" --notes-file release-notes.md "${flags[@]}"
