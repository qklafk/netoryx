# Техработы: управление для администраторов

[admin_maintenance]
title = "Техработы"
home = "🛠 <b>Технические работы</b>\n\n{status}\n\n💬 Текст для пользователей: {message}\n👥 Тестировщики с доступом: {testers}\n🧩 Отключённые разделы: {modules}\n\n🗓 <b>Запланировано:</b>\n{windows}\n\n<i>Администраторы пользуются ботом как обычно, даже во время работ.</i>"
none = "нет"
message_default = "стандартный"
message_custom = "свой ({langs})"
window_line = "• {start} — {end}"
saved = "Сохранено ✅"
turned_off = "Техработы выключены — пользователи получат уведомление ✅"
ask_eta = "🔴 <b>Закрыть бот на техработы?</b>\n\nПользователи увидят сообщение о работах, а когда вы их выключите — получат уведомление, что всё снова работает.\n\nСколько примерно продлятся работы?"
ask_eta_change = "🕒 Когда планируете закончить?"
ask_eta_input = "🕒 Пришлите время окончания ({tz}), например <code>18:30</code>, <code>25.12 10:00</code> или <code>+90m</code>."
ask_message = "✏️ Пришлите текст, который увидят пользователи ({lang}). До {limit} символов, без форматирования.\n\nВремя окончания добавится автоматически."
ask_testers = "👥 <b>Тестировщики</b>\n\nЭти пользователи пользуются ботом как обычно, даже во время работ. Пришлите их Telegram ID через пробел или запятую — список заменится целиком.\n\nСейчас: <code>{ids}</code>"
modules = "🧩 <b>Частичные техработы</b>\n\nОтключите отдельные разделы — остальное продолжит работать. Пользователи увидят «раздел временно недоступен».\n\n✅ работает · ⛔️ отключён"
ask_window = "🗓 <b>Плановые работы</b>\n\nПришлите начало и конец ({tz}), например:\n<code>25.12 03:00 - 05:00</code>\n<code>25.12 23:00 - 26.12 01:00</code>\n<code>03:00 - +2h</code>\n\nАдминистраторы получат напоминание за {minutes} мин до начала."
window_canceled = "Плановые работы отменены"
window_gone = "Это окно уже завершилось или отменено"

[admin_maintenance.status]
off = "🟢 Бот работает в обычном режиме."
on = "🔴 <b>Бот закрыт на техработы</b> с {since}.\nОкончание: {eta}"
window = "🔴 <b>Идут плановые работы</b> — до {eta}."

[admin_maintenance.btn]
on = "🔴 Включить техработы"
off = "🟢 Выключить техработы"
eta = "🕒 Изменить срок"
eta_custom = "🕒 Указать время"
no_eta = "♾ Без срока"
text_ru = "✏️ Текст RU"
text_en = "✏️ Текст EN"
text_reset = "↩️ Стандартный текст"
testers = "👥 Тестировщики"
testers_clear = "🧹 Очистить список"
modules = "🧩 Отключить разделы"
plan = "🗓 Запланировать работы"
cancel_window = "❌ Отменить работы {start}"

[admin_maintenance.error]
time = "Не понял время 🤔 Пример: <code>18:30</code> или <code>+2h</code>. Время должно быть в будущем."
too_long = "Слишком длинный текст — не больше {limit} символов."
ids = "Не нашёл ID 🤔 Пришлите числа через пробел или запятую (не больше {limit})."
window = "Не понял интервал 🤔 Пример: <code>25.12 03:00 - 05:00</code>. Конец должен быть в будущем."
window_rejected = "Не получилось запланировать: {reason}"
