# Веб-кабинет: сообщения бота и письма.

[web_cabinet]
unavailable = "Веб-кабинет сейчас недоступен."
link = "🌐 <b>Веб-кабинет</b>\n\nСсылка для входа одноразовая и действует {minutes}. Никому её не передавайте."
open = "Открыть кабинет"
button = "🌐 Веб-кабинет"

[web_cabinet.mail]
login_subject = "{brand}: вход в кабинет"
login_body = "Здравствуйте!\n\nЧтобы войти в кабинет {brand}, откройте ссылку (одноразовая, действует {minutes} мин.):\n{link}\n\nЕсли вы не запрашивали вход, просто проигнорируйте это письмо."
verify_subject = "{brand}: подтвердите e-mail"
verify_body = "Здравствуйте!\n\nЧтобы подтвердить этот адрес для входа в кабинет {brand}, откройте ссылку (действует 24 часа):\n{link}\n\nЕсли вы не запрашивали подтверждение, просто проигнорируйте это письмо."
