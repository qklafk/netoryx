# Web cabinet: bot messages and e-mails.

[web_cabinet]
unavailable = "کابین وب در حال حاضر در دسترس نیست."
link = "🌐 <b>کابین وب</b>\n\nاین پیوند ورود فقط یک بار کار می‌کند و پس از {minutes} منقضی می‌شود. آن را به کسی ندهید."
open = "باز کردن کابین"
button = "🌐 کابین وب"

[web_cabinet.mail]
login_subject = "{brand}: ورود به حساب کاربری"
login_body = "سلام!\n\nبرای ورود به حساب {brand} این پیوند را باز کنید (یک‌بار مصرف، معتبر برای {minutes} دقیقه):\n{link}\n\nاگر شما درخواست ورود نداده‌اید، این ایمیل را نادیده بگیرید."
verify_subject = "{brand}: تأیید ایمیل"
verify_body = "سلام!\n\nبرای تأیید این نشانی جهت ورود به حساب {brand} این پیوند را باز کنید (معتبر برای ۲۴ ساعت):\n{link}\n\nاگر شما چنین درخواستی نداده‌اید، این ایمیل را نادیده بگیرید."
