# Web cabinet: bot messages and e-mails.

[web_cabinet]
unavailable = "Веб-кабинет қазір қолжетімсіз."
link = "🌐 <b>Веб-кабинет</b>\n\nКіру сілтемесі бір рет қана жұмыс істейді және {minutes} ішінде жарамсыз болады. Оны ешкімге бермеңіз."
open = "Кабинетті ашу"
button = "🌐 Веб-кабинет"

[web_cabinet.mail]
login_subject = "{brand}: аккаунтқа кіру"
login_body = "Сәлем!\n\n{brand} аккаунтына кіру үшін мына сілтемені ашыңыз (бір реттік, {minutes} минут жарамды):\n{link}\n\nЕгер кіруді сіз сұрамаған болсаңыз, бұл хатты елемей-ақ қойыңыз."
verify_subject = "{brand}: e-mail мекенжайын растаңыз"
verify_body = "Сәлем!\n\n{brand} аккаунтына кіру үшін бұл мекенжайды растау мақсатында мына сілтемені ашыңыз (24 сағат жарамды):\n{link}\n\nЕгер мұны сіз сұрамаған болсаңыз, бұл хатты елемей-ақ қойыңыз."
