# Web cabinet: bot messages and e-mails.

[web_cabinet]
unavailable = "Веб-кабінет зараз недоступний."
link = "🌐 <b>Веб-кабінет</b>\n\nЦе посилання для входу діє один раз і закінчується через {minutes}. Нікому його не передавайте."
open = "Відкрити кабінет"
button = "🌐 Веб-кабінет"

[web_cabinet.mail]
login_subject = "{brand}: вхід в обліковий запис"
login_body = "Вітаємо!\n\nЩоб увійти в обліковий запис {brand}, відкрийте це посилання (одноразове, діє {minutes} хв):\n{link}\n\nЯкщо ви не запитували вхід, просто проігноруйте цей лист."
verify_subject = "{brand}: підтвердьте e-mail"
verify_body = "Вітаємо!\n\nЩоб підтвердити цю адресу для входу в обліковий запис {brand}, відкрийте це посилання (діє 24 години):\n{link}\n\nЯкщо ви цього не запитували, просто проігноруйте цей лист."
