# Support: user tickets and admin replies

[tickets]
title = "Звернення в підтримку"
home = "🆘 <b>Підтримка {brand}</b>\n\nЩось не працює або є питання? Опишіть його — ми відповімо тут, у боті. Скриншоти вітаються 📸\n\nЗазвичай відповідаємо протягом кількох годин."
list = "📂 <b>Ваші звернення</b>\n\n🟡 чекає на нас · 🟢 є відповідь · ⚪️ закрито"
list_empty = "У вас ще немає звернень. Якщо щось піде не так — просто напишіть, допоможемо 🙌"
not_found = "Звернення не знайдено 🤷"
view = "💬 <b>Звернення #{id}</b> · {status}\n<i>{subject}</i>\n\n{messages}"
ask_new = "✍️ Опишіть проблему одним повідомленням: що сталося, на якому пристрої та в якому застосунку. Можна додати скриншот.\n\nЩо більше деталей, то швидше допоможемо 🙏"
created = "✅ Звернення <b>#{id}</b> створено!\n\nМи відповімо тут, у боті — вам надійде сповіщення."
ask_reply = "✍️ Напишіть повідомлення до звернення #{id} (можна й скриншот):"
sent = "✅ Повідомлення надіслано в підтримку."
closed = "Звернення закрито"
attachment = "📎 <i>вкладення</i>"
earlier = "<i>… попередні повідомлення приховано</i>"
message = "<b>{author}</b> · <i>{time}</i>\n{text}"
answer = "💬 <b>Підтримка відповіла</b> на звернення #{id}:\n\n{text}"
closed_by_support = "✅ Звернення #{id} закрито. Якщо допомога ще потрібна, просто напишіть у нього знову — ми побачимо."

[tickets.btn]
new = "✍️ Написати в підтримку"
my = "📂 Мої звернення"
my_unread = "📂 Мої звернення · 🔔 {count}"
chat = "💬 Чат із підтримкою"
open = "📂 Відкрити звернення"
reply = "✍️ Відповісти"
write_again = "✍️ Написати ще"
close = "✅ Вирішено, закрити"
open_admin = "📂 Відкрити звернення"

[tickets.status]
open = "🟡 чекає на підтримку"
answered = "🟢 є відповідь"
closed = "⚪️ закрито"

[tickets.author]
support = "🛟 Підтримка"
user = "👤 Користувач"
you = "👤 Ви"

[tickets.error]
empty = "Повідомлення порожнє — напишіть текст або додайте скриншот."
too_long = "Повідомлення задовге — до 4000 символів, будь ласка."
too_many_open = "У вас уже кілька відкритих звернень. Дочекайтеся відповіді або закрийте вирішені 🙏"
not_found = "Звернення не знайдено 🤷"
forbidden = "Звернення не знайдено 🤷"
unsupported = "Надішліть текст, фото або файл — я передам їх у підтримку."

[tickets.notify]
new = "🆘 <b>Нове звернення #{id}</b>\nВід: {user} (<code>{user_id}</code>)\n\n{text}"
reply = "💬 <b>Нове повідомлення у зверненні #{id}</b>\nВід: {user} (<code>{user_id}</code>)\n\n{text}"

[tickets.admin]
inbox = "🆘 <b>Звернення</b> · {filter}\n\nЧекають на відповідь: <b>{waiting}</b>\nСпочатку ті, що чекають найдовше."
inbox_empty = "🆘 <b>Звернення</b> · {filter}\n\nЧекають на відповідь: <b>{waiting}</b>\n\nТут порожньо ✨"
view = "💬 <b>Звернення #{id}</b> · {status}\n<i>{subject}</i>\n👤 {user} (<code>{user_id}</code>) · відкрито {created}\n\n{messages}"
ask_reply = "✍️ Напишіть відповідь на звернення #{id}. Можна додати фото або файл — користувач отримає його одразу."
delivered = "✅ Відповідь доставлено."
not_delivered = "⚠️ Відповідь збережено, але не доставлено: користувач заблокував бота."
start_private = "Відкрийте особистий чат із ботом (/start), і я надішлю звернення туди."
opened_private = "Звернення надіслано в особистий чат"

[tickets.admin.tab]
open = "🟡 Чекають"
answered = "🟢 З відповіддю"
closed = "⚪️ Закриті"

[tickets.admin.btn]
files = "📎 Вкладення ({count})"
close = "✅ Закрити звернення"
inbox = "🆘 До звернень"
