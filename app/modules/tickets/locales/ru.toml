sent = "✅ Сообщение отправлено в поддержку."
closed = "Обращение закрыто"
attachment = "📎 <i>вложение</i>"
earlier = "<i>… более ранние сообщения скрыты</i>"
message = "<b>{author}</b> · <i>{time}</i>\n{text}"
answer = "💬 <b>Ответ поддержки</b> по обращению #{id}:\n\n{text}"
closed_by_support = "✅ Обращение #{id} закрыто. Если вопрос остался — просто напишите в него снова, мы увидим."

[tickets.btn]
new = "✍️ Написать в поддержку"
my = "📂 Мои обращения"
my_unread = "📂 Мои обращения · 🔔 {count}"
chat = "💬 Чат с поддержкой"
open = "📂 Открыть обращение"
reply = "✍️ Ответить"
write_again = "✍️ Написать снова"
close = "✅ Вопрос решён, закрыть"
open_admin = "📂 Открыть обращение"

[tickets.status]
open = "🟡 ждёт ответа"
answered = "🟢 есть ответ"
closed = "⚪️ закрыто"

[tickets.author]
support = "🛟 Поддержка"
user = "👤 Пользователь"
you = "👤 Вы"

[tickets.error]
empty = "Сообщение пустое — напишите текст или приложите скриншот."
too_long = "Слишком длинное сообщение — сократите, пожалуйста, до 4000 символов."
too_many_open = "У вас уже несколько открытых обращений. Дождитесь ответа или закройте решённые 🙏"
not_found = "Обращение не найдено 🤷"
forbidden = "Обращение не найдено 🤷"
unsupported = "Пришлите текст, фото или файл — такие сообщения я передам в поддержку."

[tickets.notify]
new = "🆘 <b>Новое обращение #{id}</b>\nОт: {user} (<code>{user_id}</code>)\n\n{text}"
reply = "💬 <b>Новое сообщение в обращении #{id}</b>\nОт: {user} (<code>{user_id}</code>)\n\n{text}"

[tickets.admin]
inbox = "🆘 <b>Обращения</b> · {filter}\n\nЖдут ответа: <b>{waiting}</b>\nСначала — те, что ждут дольше всех."
inbox_empty = "🆘 <b>Обращения</b> · {filter}\n\nЖдут ответа: <b>{waiting}</b>\n\nЗдесь пусто ✨"
view = "💬 <b>Обращение #{id}</b> · {status}\n<i>{subject}</i>\n👤 {user} (<code>{user_id}</code>) · создано {created}\n\n{messages}"
ask_reply = "✍️ Напишите ответ для обращения #{id}. Можно приложить фото или файл — пользователь получит его сразу."
delivered = "✅ Ответ доставлен пользователю."
not_delivered = "⚠️ Ответ сохранён, но доставить его не удалось: пользователь заблокировал бота."
start_private = "Откройте личный чат с ботом (/start) — и я пришлю туда обращение."
opened_private = "Обращение отправлено вам в личные сообщения"

[tickets.admin.tab]
open = "🟡 Ждут"
answered = "🟢 Отвечены"
closed = "⚪️ Закрыты"

[tickets.admin.btn]
files = "📎 Вложения ({count})"
close = "✅ Закрыть обращение"
inbox = "🆘 К обращениям"
