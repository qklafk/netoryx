# Поддержка: обращения пользователей и ответы администраторов

[tickets]
title = "Обращения"
home = "🆘 <b>Поддержка {brand}</b>\n\nЧто-то не работает или есть вопрос? Опишите ситуацию — ответим прямо здесь, в боте. Можно приложить скриншот 📸\n\nОбычно отвечаем в течение нескольких часов."
list = "📂 <b>Ваши обращения</b>\n\n🟡 ждёт ответа · 🟢 есть ответ · ⚪️ закрыто"
list_empty = "У вас пока нет обращений. Если что-то случится — пишите, поможем 🙌"
not_found = "Обращение не найдено 🤷"
view = "💬 <b>Обращение #{id}</b> · {status}\n<i>{subject}</i>\n\n{messages}"
ask_new = "✍️ Опишите проблему одним сообщением: что случилось, на каком устройстве и в каком приложении. Можно приложить скриншот.\n\nЧем подробнее — тем быстрее поможем 🙏"
created = "✅ Обращение <b>#{id}</b> создано!\n\nМы ответим здесь же, в боте, — уведомление придёт сразу."
