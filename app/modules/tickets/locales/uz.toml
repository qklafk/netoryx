# Support: user tickets and admin replies

[tickets]
title = "Yordam murojaatlari"
home = "🆘 <b>{brand} yordam xizmati</b>\n\nNimadir ishlamayaptimi yoki savolingiz bormi? Tasvirlab yozing — shu yerda, botda javob beramiz. Skrinshotlar mamnuniyat bilan qabul qilinadi 📸\n\nOdatda bir necha soat ichida javob beramiz."
list = "📂 <b>Murojaatlaringiz</b>\n\n🟡 bizni kutmoqda · 🟢 javob berilgan · ⚪️ yopilgan"
list_empty = "Sizda hali murojaatlar yoʻq. Biror muammo boʻlsa, shunchaki yozing — yordam beramiz 🙌"
not_found = "Murojaat topilmadi 🤷"
view = "💬 <b>#{id} murojaat</b> · {status}\n<i>{subject}</i>\n\n{messages}"
ask_new = "✍️ Muammoni bitta xabarda tasvirlang: nima boʻldi, qaysi qurilmada va qaysi ilovada. Skrinshot qoʻshishingiz mumkin.\n\nTafsilotlar qancha koʻp boʻlsa, shuncha tez yordam beramiz 🙏"
created = "✅ <b>#{id}</b> murojaat yaratildi!\n\nShu yerda, botda javob beramiz — sizga bildirishnoma keladi."
ask_reply = "✍️ #{id} murojaat uchun xabaringizni yozing (skrinshot ham boʻladi):"
sent = "✅ Xabar yordam xizmatiga yuborildi."
closed = "Murojaat yopildi"
attachment = "📎 <i>ilova</i>"
earlier = "<i>… oldingi xabarlar yashirilgan</i>"
message = "<b>{author}</b> · <i>{time}</i>\n{text}"
answer = "💬 <b>Yordam xizmati</b> #{id} murojaatga javob berdi:\n\n{text}"
closed_by_support = "✅ #{id} murojaat yopildi. Hali yordam kerak boʻlsa, unga yana yozing — biz koʻramiz."

[tickets.btn]
new = "✍️ Yordam xizmatiga yozish"
