list = "📂 <b>Сіздің өтініштеріңіз</b>\n\n🟡 бізді күтуде · 🟢 жауап берілді · ⚪️ жабылды"
list_empty = "Сізде әлі өтініштер жоқ. Бірдеңе болса, жай ғана жазыңыз — көмектесеміз 🙌"
not_found = "Өтініш табылмады 🤷"
