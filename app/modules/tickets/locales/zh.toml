chat = "💬 与客服聊天"
open = "📂 打开工单"
reply = "✍️ 回复"
write_again = "✍️ 再次留言"
close = "✅ 已解决，关闭"
open_admin = "📂 打开工单"

[tickets.status]
open = "🟡 等待客服回复"
answered = "🟢 已回复"
closed = "⚪️ 已关闭"

[tickets.author]
support = "🛟 客服"
user = "👤 用户"
you = "👤 您"

[tickets.error]
