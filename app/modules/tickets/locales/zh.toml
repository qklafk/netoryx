# Support: user tickets and admin replies

[tickets]
title = "客服工单"
home = "🆘 <b>{brand} 客服</b>\n\n遇到问题或有疑问？请描述一下，我们会直接在机器人中回复。欢迎附上截图 📸\n\n我们通常在几小时内回复。"
list = "📂 <b>您的工单</b>\n\n🟡 等待我们回复 · 🟢 已回复 · ⚪️ 已关闭"
list_empty = "您还没有工单。如有任何问题，直接写下来——我们会帮您 🙌"
