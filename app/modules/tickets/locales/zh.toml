view = "💬 <b>工单 #{id}</b> · {status}\n<i>{subject}</i>\n\n{messages}"
ask_new = "✍️ 请用一条消息描述问题：发生了什么、在哪台设备、哪个应用上。可以附上截图。\n\n细节越多，我们帮得越快 🙏"
created = "✅ 工单 <b>#{id}</b> 已创建！\n\n我们会在机器人中回复——届时您会收到通知。"
