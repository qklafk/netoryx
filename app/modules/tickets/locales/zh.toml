not_found = "未找到工单 🤷"
forbidden = "未找到工单 🤷"
unsupported = "请发送文字、图片或文件——我会转交给客服。"

[tickets.notify]
new = "🆘 <b>新工单 #{id}</b>\n来自：{user}（<code>{user_id}</code>）\n\n{text}"
