# Cost sharing: reminders to members and the owner's overview.

[cost_sharing]
menu = "Складчина"
month_year = "{month} {year}"
reminder = "💸 <b>Складчина за {month}</b>\n\nПривіт! Час скинутися на наш VPN-сервер — ваша частка <b>{share}</b>.\n\nКоли надішлете, натисніть кнопку нижче, щоб власник знав 🙌"
details = "Куди надсилати: {details}"
thanks = "🙏 Дякуємо! Вашу оплату за {month} відзначено, власника сповіщено."
unknown = "Цей збір уже закрито 🙂"
owner_paid = "💸 {name} відзначив оплату за {month}: {share}. Оплатили: {paid} з {total}."
owner_started = "💸 Складчина за {month}: нагадування надіслано ({count}). Частка — {share}, усього {total}."
sent = "Надіслано нагадувань: {count}"
not_configured = "💸 <b>Складчина</b>\n\nЦей розділ допомагає щомісяця збирати гроші на сервер: бот нагадує учасникам про їхню частку й показує, хто вже заплатив.\n\nЩоб увімкнути, вкажіть у налаштуваннях суму на місяць, день нагадування та реквізити для оплати."
not_started = "💸 <b>Складчина за {month}</b>\n\nНагадування надсилаються автоматично {day}-го числа. Загальна сума — {total}.\n\nМожна надіслати їх просто зараз."
overview = "💸 <b>Складчина за {month}</b>\n\nУсього: {total} · частка: {share}\nОплатили: {paid} з {count}"

[cost_sharing.month]
1 = "січень"
2 = "лютий"
3 = "березень"
4 = "квітень"
5 = "травень"
6 = "червень"
7 = "липень"
8 = "серпень"
9 = "вересень"
10 = "жовтень"
11 = "листопад"
12 = "грудень"

[cost_sharing.btn]
paid = "✅ Я оплатив"
remind = "📣 Нагадати тим, хто не оплатив"
start = "📣 Надіслати зараз"
