# Cost sharing: reminders to members and the owner's overview.

[cost_sharing]
menu = "Ортақ төлем"
month_year = "{year} ж. {month}"
reminder = "💸 <b>{month} айының ортақ төлемі</b>\n\nСәлем! VPN серверімізге ақша жинайтын уақыт келді — сіздің үлесіңіз <b>{share}</b>.\n\nЖібергеннен кейін иесі білуі үшін төмендегі түймені басыңыз 🙌"
details = "Қайда жіберу керек: {details}"
