unknown = "Бұл жинау жабылып қойған 🙂"
owner_paid = "💸 {name} {month} айының төлемін белгіледі: {share}. Төлегендер: {total} ішінен {paid}."
owner_started = "💸 {month} айының ортақ төлемі: еске салғыштар жіберілді ({count}). Үлес — {share}, барлығы {total}."
sent = "Жіберілген еске салғыштар: {count}"
not_configured = "💸 <b>Ортақ төлем</b>\n\nБұл бөлім ай сайын серверге ақша жинауға көмектеседі: бот қатысушыларға үлесін еске салып, кімнің төлегенін көрсетеді.\n\nҚосу үшін баптауларда айлық соманы, еске салу күнін және төлем деректемелерін көрсетіңіз."
not_started = "💸 <b>{month} айының ортақ төлемі</b>\n\nЕске салғыштар айдың {day}-күні автоматты түрде жіберіледі. Жалпы сома — {total}.\n\nОларды дәл қазір жіберуге болады."
overview = "💸 <b>{month} айының ортақ төлемі</b>\n\nБарлығы: {total} · үлес: {share}\nТөлегендер: {count} ішінен {paid}"

