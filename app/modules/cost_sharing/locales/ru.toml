# Складчина: напоминания участникам и сводка для владельца.

[cost_sharing]
menu = "Складчина"
month_year = "{month} {year}"
reminder = "💸 <b>Складчина за {month}</b>\n\nПривет! Пора скинуться на сервер для нашего VPN — твоя доля: <b>{share}</b>.\n\nКогда переведёшь, нажми кнопку ниже, чтобы владелец знал 🙌"
details = "Куда перевести: {details}"
thanks = "🙏 Спасибо! Отметили оплату за {month} — владелец получил уведомление."
unknown = "Эта складчина уже закрыта 🙂"
owner_paid = "💸 {name} отметил(а) оплату за {month}: {share}. Оплатили {paid} из {total}."
owner_started = "💸 Складчина за {month}: отправил напоминания ({count}). Доля — {share}, всего {total}."
sent = "Напоминаний отправлено: {count}"
not_configured = "💸 <b>Складчина</b>\n\nРаздел поможет каждый месяц собирать на оплату сервера: бот сам напомнит участникам об их доле и покажет, кто уже перевёл.\n\nЧтобы включить, укажите в настройках сумму в месяц, день напоминания и куда переводить."
not_started = "💸 <b>Складчина за {month}</b>\n\nНапоминания уйдут автоматически {day}-го числа. Общая сумма — {total}.\n\nМожно разослать их прямо сейчас."
overview = "💸 <b>Складчина за {month}</b>\n\nВсего: {total} · доля: {share}\nОплатили: {paid} из {count}"

[cost_sharing.month]
1 = "январь"
2 = "февраль"
3 = "март"
4 = "апрель"
5 = "май"
6 = "июнь"
7 = "июль"
8 = "август"
9 = "сентябрь"
10 = "октябрь"
11 = "ноябрь"
12 = "декабрь"

[cost_sharing.btn]
paid = "✅ Я перевёл(а)"
remind = "📣 Напомнить тем, кто не оплатил"
start = "📣 Разослать сейчас"
