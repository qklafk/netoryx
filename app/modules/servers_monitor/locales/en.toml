# Server monitoring: admin screens and alerts.

[servers_monitor]
menu = "Monitoring"
title = "📡 <b>Server monitoring</b>"
intro = "Tap a server to see its load right now: CPU, memory, disk, traffic and the Xray state.\n\n🟢 working · 🟡 had failures · 🔴 not responding · ⚪️ switched off"
empty = "No servers yet. Add a 3x-ui or Remnawave panel in the servers section."
server_title = "🖥 <b>{name}</b> · {kind}{version}"
core_ok = "🟢 Xray is running{version}"
core_down = "🔴 Xray is not running ({state}){error}"
cpu = "⚙️ CPU: {percent}% {bar}{cores}"
cores = " · {n} cores"
cpu_cores_only = "⚙️ CPU cores: {n}"
load = "📈 Load: {load}"
mem = "🧠 Memory: {used} of {total} ({percent}%) {bar}"
swap = "🔁 Swap: {used} of {total} ({percent}%)"
disk = "💾 Disk: {used} of {total} ({percent}%) {bar}"
net = "🌐 Network now: ↑ {up} · ↓ {down}"
traffic = "📊 Traffic since boot: ↑ {up} · ↓ {down}"
online = "👥 Online: {count}"
connections = "🔌 TCP connections: {count}"
uptime = "⏱ Uptime: {value}"
uptime_days = "{d} d {h} h"
uptime_hours = "{h} h {m} min"
per_second = "{value}/s"
nodes = "<b>Nodes</b> · {online} of {total} connected:"
node_up = "🟢 {name}{details}"
node_down = "🔴 {name} — disconnected{reason}"
node_disabled = "⚪️ {name} — disabled"
node_online = "{count} online"
not_supported = "🖥 <b>{name}</b>\n\nThis panel does not report the server state."
timeout = "🖥 <b>{name}</b>\n\n⏳ The server did not answer in time. Please try again in a minute."
unreachable = "🖥 <b>{name}</b>\n\n🔴 Could not get the server state:\n<code>{error}</code>"
restart_confirm = "♻️ <b>Restart Xray on “{name}”?</b>\n\nAll connections drop for a few seconds, then clients reconnect on their own."
restart_nodes_confirm = "♻️ <b>Restart every node of “{name}”?</b>\n\nAll connections drop for a few seconds, then clients reconnect on their own."
restarted = "✅ Restarted"
restart_failed = "😔 Could not restart — the server did not answer. Please try again later."

[servers_monitor.btn]
restart = "♻️ Restart Xray"
restart_nodes = "♻️ Restart nodes"
restart_ok = "♻️ Yes, restart"

[servers_monitor.unit]
b = "{n} B"
kb = "{n} KB"
mb = "{n} MB"
gb = "{n} GB"
tb = "{n} TB"
pb = "{n} PB"

[servers_monitor.alert]
cpu = "🔥 <b>{server}</b>: CPU load is at {value}%"
mem = "🧠 <b>{server}</b>: memory is {value}% full"
disk = "💾 <b>{server}</b>: the disk is {value}% full — time to clean up logs or grow the disk"
core = "🔴 <b>{server}</b>: Xray is not running ({state}){error}"
node = "🔴 <b>{server}</b>: node {node} lost connection{error}"

[servers_monitor.ok]
cpu = "✅ <b>{server}</b>: CPU load is back to normal"
mem = "✅ <b>{server}</b>: memory is back to normal"
disk = "✅ <b>{server}</b>: there is enough disk space again"
core = "✅ <b>{server}</b>: Xray is running again"
node = "✅ <b>{server}</b>: node {node} is connected again"
