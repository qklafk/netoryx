# Мониторинг серверов: экраны администратора и оповещения.

[servers_monitor]
menu = "Мониторинг"
title = "📡 <b>Мониторинг серверов</b>"
intro = "Нажмите на сервер, чтобы увидеть нагрузку прямо сейчас: процессор, память, диск, трафик и состояние Xray.\n\n🟢 работает · 🟡 были сбои · 🔴 не отвечает · ⚪️ выключен"
empty = "Серверов пока нет. Добавьте панель 3x-ui или Remnawave в разделе серверов."
server_title = "🖥 <b>{name}</b> · {kind}{version}"
core_ok = "🟢 Xray работает{version}"
core_down = "🔴 Xray не работает ({state}){error}"
cpu = "⚙️ Процессор: {percent}% {bar}{cores}"
cores = " · {n} ядер"
cpu_cores_only = "⚙️ Ядер процессора: {n}"
load = "📈 Нагрузка: {load}"
mem = "🧠 Память: {used} из {total} ({percent}%) {bar}"
swap = "🔁 Подкачка: {used} из {total} ({percent}%)"
disk = "💾 Диск: {used} из {total} ({percent}%) {bar}"
net = "🌐 Сеть сейчас: ↑ {up} · ↓ {down}"
traffic = "📊 Трафик с запуска: ↑ {up} · ↓ {down}"
online = "👥 Онлайн: {count}"
connections = "🔌 TCP-соединений: {count}"
uptime = "⏱ Без перезагрузки: {value}"
uptime_days = "{d} д {h} ч"
uptime_hours = "{h} ч {m} мин"
per_second = "{value}/с"
nodes = "<b>Ноды</b> · на связи {online} из {total}:"
node_up = "🟢 {name}{details}"
node_down = "🔴 {name} — нет связи{reason}"
node_disabled = "⚪️ {name} — выключена"
node_online = "{count} онлайн"
not_supported = "🖥 <b>{name}</b>\n\nЭта панель не сообщает состояние сервера."
timeout = "🖥 <b>{name}</b>\n\n⏳ Сервер не ответил вовремя. Попробуйте ещё раз через минуту."
unreachable = "🖥 <b>{name}</b>\n\n🔴 Не удалось получить состояние сервера:\n<code>{error}</code>"
restart_confirm = "♻️ <b>Перезапустить Xray на «{name}»?</b>\n\nВсе подключения прервутся на несколько секунд, затем клиенты переподключатся сами."
restart_nodes_confirm = "♻️ <b>Перезапустить все ноды «{name}»?</b>\n\nВсе подключения прервутся на несколько секунд, затем клиенты переподключатся сами."
restarted = "✅ Перезапуск выполнен"
restart_failed = "😔 Не удалось перезапустить — сервер не ответил. Попробуйте ещё раз чуть позже."

[servers_monitor.btn]
restart = "♻️ Перезапустить Xray"
restart_nodes = "♻️ Перезапустить ноды"
restart_ok = "♻️ Да, перезапустить"

[servers_monitor.unit]
b = "{n} Б"
kb = "{n} КБ"
mb = "{n} МБ"
gb = "{n} ГБ"
tb = "{n} ТБ"
pb = "{n} ПБ"

[servers_monitor.alert]
cpu = "🔥 <b>{server}</b>: процессор загружен на {value}%"
mem = "🧠 <b>{server}</b>: память заполнена на {value}%"
disk = "💾 <b>{server}</b>: диск заполнен на {value}% — пора почистить логи или расширить диск"
core = "🔴 <b>{server}</b>: Xray не работает ({state}){error}"
node = "🔴 <b>{server}</b>: нода {node} потеряла связь{error}"

[servers_monitor.ok]
cpu = "✅ <b>{server}</b>: нагрузка на процессор снизилась"
mem = "✅ <b>{server}</b>: память снова в норме"
disk = "✅ <b>{server}</b>: на диске снова достаточно места"
core = "✅ <b>{server}</b>: Xray снова работает"
node = "✅ <b>{server}</b>: нода {node} снова на связи"
