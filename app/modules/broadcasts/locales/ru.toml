# Рассылки (админ-раздел)

[broadcasts]
title = "Рассылки"
home = "📣 <b>Рассылки</b>\n\nОтправьте сообщение всем пользователям или выбранной группе: текст, фото, видео, файл, опрос — что угодно.\n\n🚀 Идёт сейчас: {running}\n📝 Черновиков: {drafts}"
compose = "✍️ <b>Новая рассылка</b>\n\nПришлите сообщение, которое получат пользователи. Подойдёт любое: текст с форматированием, фото или видео с подписью, файл, голосовое, опрос.\n\nЯ разошлю его ровно в таком виде."
ask_buttons = "🔘 <b>Кнопки-ссылки</b>\n\nХотите добавить кнопки под сообщением? Пришлите их по одной строке на ряд:\n<code>Наш канал - https://t.me/channel</code>\n\nНесколько кнопок в ряду разделяйте «|»:\n<code>Сайт - https://example.com | Поддержка - https://t.me/support</code>"
audience = "👥 <b>Кому отправить?</b>\n\nЗаблокировавшие бота и забаненные пользователи в рассылку не попадают."
audience_empty = "Здесь пока пусто — выберите другую аудиторию."
ask_ids = "🎯 Пришлите Telegram ID получателей через пробел, запятую или с новой строки."
expired = "Черновик устарел — начните рассылку заново."
draft = "📝 <b>Рассылка #{id}</b> — черновик\n\n👥 Аудитория: {audience}\n📬 Получателей: <b>{count}</b>\n🔘 Кнопок: {buttons}\n🕒 Запуск: {when}\n\nНажмите «Предпросмотр», чтобы увидеть сообщение глазами пользователя."
manual = "вручную"
not_found = "Рассылка не найдена 🤷"
view = "📣 <b>Рассылка #{id}</b>\n\nСтатус: {status}\n👥 Аудитория: {audience}\n\nСоздана: {created}\nНачата: {started}\nЗавершена: {finished}\n\n📬 Всего: {total}\n✅ Доставлено: {sent}\n🚫 Заблокировали бота: {blocked}\n⚠️ Ошибки: {failed}"
history = "📜 <b>История рассылок</b> (всего {total})\n\n📝 черновик · 🚀 идёт · ✅ завершена · ⏹ остановлена"
history_empty = "Рассылок ещё не было. Самое время сделать первую ✍️"
preview_sent = "👀 Отправил вам предпросмотр"
preview_failed = "Не получилось отправить предпросмотр — возможно, исходное сообщение удалено"
nobody = "В этой аудитории сейчас никого нет"
confirm_send = "🚀 Отправить рассылку #{id}?\n\nПолучателей: <b>{count}</b>\n\nОстановить можно в любой момент."
started = "Рассылка запущена 🚀"
ask_schedule = "🕒 <b>Когда отправить?</b>\n\nПришлите дату и время ({tz}), например:\n<code>18:30</code> — сегодня (или завтра, если время прошло)\n<code>25.12 10:00</code> — конкретная дата\n<code>+2h</code> — через 2 часа\n\nСейчас: {now}"
unscheduled = "Расписание снято"
discarded = "Черновик удалён"
confirm_stop = "⏹ Остановить рассылку #{id}? Тем, кто уже получил сообщение, оно останется."
