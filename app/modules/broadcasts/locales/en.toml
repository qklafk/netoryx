# Broadcasts (admin section)

[broadcasts]
title = "Broadcasts"
home = "📣 <b>Broadcasts</b>\n\nSend a message to every user or to a chosen group: text, photo, video, file, poll - anything.\n\n🚀 Sending now: {running}\n📝 Drafts: {drafts}"
compose = "✍️ <b>New broadcast</b>\n\nSend me the message users should receive. Anything works: formatted text, a photo or video with a caption, a file, a voice message, a poll.\n\nI'll deliver it exactly as it is."
ask_buttons = "🔘 <b>Link buttons</b>\n\nWant buttons under the message? Send one line per row:\n<code>Our channel - https://t.me/channel</code>\n\nSeparate buttons in a row with \"|\":\n<code>Website - https://example.com | Support - https://t.me/support</code>"
audience = "👥 <b>Who should get it?</b>\n\nUsers who blocked the bot and banned users are always skipped."
audience_empty = "Nothing here yet - pick another audience."
ask_ids = "🎯 Send the recipients' Telegram IDs separated by spaces, commas or new lines."
expired = "This draft has expired - please start the broadcast again."
draft = "📝 <b>Broadcast #{id}</b> - draft\n\n👥 Audience: {audience}\n📬 Recipients: <b>{count}</b>\n🔘 Buttons: {buttons}\n🕒 Start: {when}\n\nTap \"Preview\" to see the message as users will."
manual = "manually"
not_found = "Broadcast not found 🤷"
view = "📣 <b>Broadcast #{id}</b>\n\nStatus: {status}\n👥 Audience: {audience}\n\nCreated: {created}\nStarted: {started}\nFinished: {finished}\n\n📬 Total: {total}\n✅ Delivered: {sent}\n🚫 Blocked the bot: {blocked}\n⚠️ Errors: {failed}"
history = "📜 <b>Broadcast history</b> ({total} total)\n\n📝 draft · 🚀 sending · ✅ done · ⏹ stopped"
history_empty = "No broadcasts yet. Time to send the first one ✍️"
preview_sent = "👀 Preview sent to you"
preview_failed = "Could not send the preview - the original message may have been deleted"
nobody = "Nobody is in this audience right now"
confirm_send = "🚀 Send broadcast #{id}?\n\nRecipients: <b>{count}</b>\n\nYou can stop it at any time."
started = "Broadcast started 🚀"
ask_schedule = "🕒 <b>When should it go out?</b>\n\nSend a date and time ({tz}), for example:\n<code>18:30</code> - today (or tomorrow if that time has passed)\n<code>25.12 10:00</code> - a specific date\n<code>+2h</code> - in 2 hours\n\nNow: {now}"
unscheduled = "Schedule removed"
discarded = "Draft deleted"
confirm_stop = "⏹ Stop broadcast #{id}? Users who already got the message keep it."
stopped = "Broadcast stopped"
already_finished = "The broadcast has already finished"

[broadcasts.btn]
new = "✍️ New broadcast"
history = "📜 History"
preview = "👀 Preview"
send = "🚀 Send now"
send_confirm = "✅ Yes, send"
schedule = "🕒 Schedule"
reschedule = "🕒 Change time"
unschedule = "❌ Remove schedule"
discard = "🗑 Delete draft"
open_draft = "📝 Open draft"
no_buttons = "➡️ No buttons"
stop = "⏹ Stop"
stop_confirm = "⏹ Yes, stop"
to_list = "📣 Back to broadcasts"

