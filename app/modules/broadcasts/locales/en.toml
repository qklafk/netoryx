[broadcasts.status]
draft = "📝 draft"
running = "🚀 sending"
done = "✅ done"
canceled = "⏹ stopped"

[broadcasts.progress]
running = "🚀 <b>Sending broadcast #{id}…</b>\n\n{bar} {percent}%\nProcessed: {processed} of {total}\n\n✅ Delivered: {sent}\n🚫 Blocked the bot: {blocked}\n⚠️ Errors: {failed}"
done = "✅ <b>Broadcast #{id} finished</b>\n\n{bar} {percent}%\nProcessed: {processed} of {total}\n\n✅ Delivered: {sent}\n🚫 Blocked the bot: {blocked}\n⚠️ Errors: {failed}"
canceled = "⏹ <b>Broadcast #{id} stopped</b>\n\n{bar} {percent}%\nProcessed: {processed} of {total}\n\n✅ Delivered: {sent}\n🚫 Blocked the bot: {blocked}\n⚠️ Errors: {failed}"

[broadcasts.error]
bad_audience = "Could not work out the audience - please choose it again."
empty = "The message is empty - send some text or media."
too_long = "The text is too long for Telegram."
bad_buttons = "Could not read the buttons 🤔 Format: <code>Text - https://link</code>, one line per row, buttons in a row separated by \"|\"."
bad_media = "This attachment cannot be broadcast."
bad_schedule = "I didn't get the time 🤔 Send e.g. <code>25.12 10:00</code> or <code>+2h</code> - and it must be in the future."
not_found = "Broadcast not found 🤷"
bad_status = "This broadcast has already started or finished."
bad_ids = "No IDs found 🤔 Send numbers separated by spaces or commas (10,000 at most)."
