rotate_confirm = "🔗 <b>Випустити нове посилання для {name}?</b>\n\nСтаре посилання на підписку одразу перестане працювати. Ми попросимо учасника заново підключити застосунок."
remove_confirm = "🗑 <b>Видалити {name}?</b>\n\nДоступ до VPN буде закрито на всіх серверах, і учасник більше не зможе користуватися ботом. Повернути його можна новим запрошенням."

