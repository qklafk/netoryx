# Members of a private VPN: owner screens and notices to members.

[members]
menu = "Members"
until = "until {date} ({left} left)"
expired_on = "ended on {date}"
gone = "This member is no longer on the list"
extended = "✅ Access extended"
paused = "⏸ Access paused"
