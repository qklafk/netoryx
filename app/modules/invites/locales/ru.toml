# Приглашения: экраны администратора и приём приглашения.

[invites]
menu = "Приглашения"
untitled = "Приглашение {code}"
uses_value = "{used} из {total}"
created = "✅ Приглашение готово"
revoked = "🚫 Приглашение отозвано"
share_text = "Держи приглашение в наш VPN — открой ссылку, и всё заработает 🙌"
revoke_confirm = "🚫 <b>Отозвать приглашение «{title}»?</b>\n\nПо ссылке больше никто не сможет присоединиться. Те, кто уже присоединился, сохранят доступ."
qr = "📷 <b>{title}</b>\n\nПокажите код — его можно отсканировать камерой телефона, откроется бот с приглашением."
joined = "🎉 {name} принял(а) ваше приглашение и уже с нами!"
joined_note = "🎉 Приглашение «{note}» сработало: {name} уже с нами!"
welcome = "🎉 <b>Добро пожаловать!</b>\n\nДоступ к VPN открыт — {until}.\n\nОсталось подключиться: нажмите кнопку ниже, выберите своё устройство и следуйте подсказкам. Это займёт пару минут 🙂"
until_date = "до {date}"
until_forever = "бессрочно"

[invites.list]
title = "✉️ <b>Приглашения</b>"
intro = "Приглашение — это ссылка, по которой близкие получают доступ к VPN без оплаты. Создайте его и просто отправьте ссылку."
empty = "Приглашений пока нет.\n\nСоздайте первое — выберите срок доступа и число устройств, а затем отправьте ссылку тому, кого хотите пригласить."

[invites.card]
title = "✉️ <b>{title}</b>"
period = "Срок доступа: {value}"
devices = "Устройств: {value}"
traffic = "Трафик: {value} в месяц"
uses = "Использовано: {value}"
valid_until = "Ссылка действует до: {value}"
state = "Статус: {value}"
link = "Ссылка:\n<code>{link}</code>"
hint = "Отправьте её тому, кого приглашаете: достаточно открыть ссылку и нажать «Старт»."

[invites.state]
active = "активно"
used = "использовано"
expired = "истёк срок ссылки"
revoked = "отозвано"

