# Invitations: admin screens and accepting an invitation.

[invites]
menu = "Запрошення"
untitled = "Запрошення {code}"
uses_value = "{used} з {total}"
created = "✅ Запрошення готове"
revoked = "🚫 Запрошення відкликано"
share_text = "Ось запрошення до нашого VPN — відкрий посилання, і все готово 🙌"
revoke_confirm = "🚫 <b>Відкликати запрошення «{title}»?</b>\n\nЗа цим посиланням більше ніхто не зможе приєднатися. Ті, хто вже приєднався, збережуть доступ."
qr = "📷 <b>{title}</b>\n\nПокажіть цей код — якщо відсканувати його камерою телефона, відкриється бот із запрошенням."
joined = "🎉 {name} прийняв ваше запрошення й тепер з нами!"
joined_note = "🎉 Запрошення «{note}» спрацювало: {name} тепер з нами!"
welcome = "🎉 <b>Ласкаво просимо!</b>\n\nВаш доступ до VPN відкрито — {until}.\n\nЗалишилося підключитися: натисніть кнопку нижче, оберіть пристрій і дотримуйтеся підказок. Це займе кілька хвилин 🙂"
until_date = "до {date}"
until_forever = "безстроково"

[invites.list]
title = "✉️ <b>Запрошення</b>"
intro = "Запрошення — це посилання, яке дає рідним і друзям безкоштовний доступ до VPN. Створіть його й просто надішліть посилання."
empty = "Запрошень ще немає.\n\nСтворіть перше — оберіть термін доступу й кількість пристроїв, а потім надішліть посилання тому, кого запрошуєте."

[invites.card]
title = "✉️ <b>{title}</b>"
period = "Термін доступу: {value}"
devices = "Пристрої: {value}"
traffic = "Трафік: {value} на місяць"
uses = "Використано: {value}"
valid_until = "Посилання дійсне до: {value}"
state = "Статус: {value}"
link = "Посилання:\n<code>{link}</code>"
hint = "Надішліть його тому, кого запрошуєте: достатньо відкрити посилання й натиснути «Start»."

[invites.state]
active = "активне"
used = "вичерпане"
expired = "термін посилання минув"
revoked = "відкликане"

[invites.new]
