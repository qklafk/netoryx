# Servers: panels, inbounds, locations, endpoints

[admin_servers]
title = "Servers"
home = "🖥 <b>Servers</b> ({count})\n\n🟢 works · 🟡 had failures · 🔴 down · ⏸ disabled\n\nPick a server or add a new one."
home_empty = "🖥 <b>Servers</b>\n\nNo servers yet. Connect a 3x-ui or Remnawave panel - I'll test the connection and pull its settings."
not_found = "Not found 🤷"
owner_only = "Only the owner can add servers and change a panel's address, credentials or TLS checking"
expired = "This wizard has expired - please start again."
saved = "✅ Saved"
deleted = "🗑 Deleted"
enabled = "▶️ Server enabled - user accounts appear on it with the next sync."
disabled = "⏸ Server disabled - user accounts are removed from it with the next sync."
edit = "✏️ <b>What should we change?</b>"
no_location = "no location"
pick_location = "📍 Choose a location:"
