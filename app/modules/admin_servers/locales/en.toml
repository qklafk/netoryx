preset_cdn_needs_xhttp = "The CDN preset only works with XHTTP inbounds"
preset_needs_reality = "This preset is for Reality inbounds"

[admin_servers.state]
disabled = "⏸ disabled"
down = "🔴 down\n<code>{error}</code>"
flaky = "🟡 failures in a row: {count}\n<code>{error}</code>"
ok = "🟢 online (checked {when})"
unknown = "⚪️ not checked yet"

[admin_servers.ping]
ok = "🔌 Connected: version {version}"
failed = "🔌 Could not connect:\n<code>{error}</code>"

[admin_servers.sync]
started = "🔄 Sync started: accounts to update - {count}."
queued = "🔄 Accounts to update: {count}. The sync runs within {minutes} min."

[admin_servers.refresh]
done = "📥 List refreshed: new {created}, changed {updated}, disabled {deactivated}.\nNew inbounds are added disabled."
failed = "⚠️ The panel did not answer:\n<code>{error}</code>"

[admin_servers.add]
kind = "➕ <b>New server</b>\n\nWhich panel does it run?"
name = "✏️ What should we call this {kind} server? E.g. \"Germany-1\". Only admins see the name."

[admin_servers.add.url]
marzban = "🌐 Send the Marzban address:\n<code>https://panel.example.com</code> or <code>http://marzban:8000</code>."
xui = "🌐 Send the full 3x-ui panel address - as in the browser, including the secret path:\n<code>https://1.2.3.4:2053/secretpath</code>"
remnawave = "🌐 Send the Remnawave address:\n<code>https://panel.example.com</code> or <code>http://remnawave:3000</code> (inside Docker)"
hiddify = "🌐 Send the Hiddify address including its administrator proxy path:\n<code>https://panel.example.com/admin-path</code>"
pasarguard = "🌐 Send the PasarGuard address:\n<code>https://panel.example.com</code> or <code>http://pasarguard:8000</code>."
marzneshin = "🌐 Send the Marzneshin address:\n<code>https://panel.example.com</code>."
telemt = "🌐 Send the telemt Control API address:\n<code>http://telemt:9091</code>"

[admin_servers.add.creds]
marzban = "🔑 Send a login and password separated by a space, or a Marzban API token.\n\nI delete the message immediately and store credentials encrypted."
xui = "🔑 Send the login and password separated by a space (<code>admin s3cret</code>) - or an API token (3x-ui 3.1+).\n\nI'll delete the message right away; credentials are stored encrypted."
remnawave = "🔑 Send a Remnawave API token (Settings → API tokens).\n\nI'll delete the message right away; the token is stored encrypted."
hiddify = "🔑 Send the Hiddify API key from Settings → API.\n\nI'll delete the message right away; the key is stored encrypted."
pasarguard = "🔑 Send a PasarGuard API key with user and system read permissions.\n\nI'll delete the message right away; the key is stored encrypted."
marzneshin = "🔑 Send the Marzneshin username and password separated by a space.\n\nI'll delete the message right away; credentials are stored encrypted."
telemt = "🔑 Send the auth_header value from the telemt config (or \"-\" if authorization is off).\n\nI'll delete the message right away."

[admin_servers.ask]
name = "✏️ New name for this {kind} server:"
location = "📍 Send a flag and a name, e.g. <code>🇩🇪 Germany</code> or <code>🇳🇱 Amsterdam</code>."
endpoint_sni = "🇷🇺 Send the SNI - a Russian domain from this Reality inbound's serverNames list (otherwise the server refuses the connection)."
endpoint_remark = "✏️ Name of this entry in apps (up to 64 characters), e.g. <code>🇩🇪 Germany · LTE</code>. Empty - the name is built automatically."
endpoint_overrides = "🧩 Send link parameter overrides as a JSON object, e.g.:\n<code>{{\"sni\": \"cdn.example.ru\", \"fp\": \"chrome\"}}</code>\n\nA <code>null</code> value removes a parameter."

[admin_servers.ask.endpoint_address]
direct = "🎯 Send the address clients use to reach the server: an IP or a domain, with a port if needed (<code>1.2.3.4</code>, <code>de.example.com:443</code>)."
relay = "🔀 Send the forwarding server's address and port: <code>5.6.7.8:443</code>. Without a port - the inbound's one."
cdn = "☁️ Send the CDN domain, e.g. <code>cdn.example.ru</code> (port - the inbound's one, or <code>cdn.example.ru:443</code>)."
ru_sni = "🔀 Now the address and port of the relay server with a Russian IP: <code>5.6.7.8:443</code>."
edit = "✏️ New address (and port): <code>1.2.3.4</code> or <code>relay.example.ru:8443</code>."

[admin_servers.test]
running = "⏳ Testing the connection…"
title = "🔌 <b>Connection test</b>\n\n{name} · {kind}\n<code>{url}</code>\n\n{result}"
ok = "✅ Connection works. Panel version: <b>{version}</b>"
inbounds = "🧩 Inbounds on the panel: {count}"
failed = "❌ Could not connect:\n<code>{error}</code>\n\nCheck the address and credentials. For a self-signed certificate turn the TLS check off."

[admin_servers.error]
name = "The name must be 1 to {limit} characters long."
url = "That doesn't look like an address 🤔 Expected something like <code>https://1.2.3.4:2053/path</code>."
location = "I didn't get it 🤔 Example: <code>🇩🇪 Germany</code> (name up to {limit} characters)."
address = "I didn't get the address 🤔 Example: <code>1.2.3.4</code> or <code>relay.example.ru:8443</code>."
overrides = "Could not apply the overrides:\n<code>{error}</code>"

[admin_servers.error.creds]
marzban = "Send a login and password separated by a space, or one API token."
xui = "Send a login and password separated by a space, or a single API token. Please try again."
remnawave = "Send the API token as one line. Please try again."
hiddify = "Send the API key as one line. Please try again."
pasarguard = "Send the API key as one line. Please try again."
marzneshin = "Send the username and password separated by a space. Please try again."
telemt = "Send the auth_header value as one line, or \"-\". Please try again."

[admin_servers.delete]
