card = "🖥 <b>{name}</b> · {kind}\n<code>{url}</code>\n\nVersion: {version}\nState: {status}\nCertificate check: {tls}"
card_inbounds = "🧩 Inbounds: {active} of {total} enabled"
card_location = "📍 Location: {location}"
saved_inbounds = "✅ Server added. Inbounds found: {count} - enable the ones you need under \"Inbounds\" and users will start getting them."
inbound_on = "🟢 enabled"
inbound_off = "⏸ disabled"
inbound_port = "same as the inbound"
inbound_no_endpoints = "⚠️ This inbound has no endpoints - users get no links for it."
inbounds = "🧩 <b>Inbounds</b>\n\nUsers only get the enabled ones 🟢. Tap one to configure it."
inbounds_empty = "🧩 <b>No inbounds yet</b>\n\nRefresh the list from the panel or create a VLESS-Reality inbound right here."
inbound = "🧩 <b>{name}</b> (id {remote_id})\n\nPort: {port}\nTransport: {transport}\nFlow: {flow}\nLocation: {location}\nState: {state}\nEndpoints: {endpoints}"
locations = "📍 <b>Locations</b>\n\nThis is how users see countries and cities in their apps. The order here is the order in the subscription."
locations_empty = "📍 <b>No locations yet</b>\n\nAdd the first one, e.g. \"🇩🇪 Germany\"."
location = "📍 <b>{title}</b>\n\nState: {state}\nInbounds: {inbounds}\nEndpoints: {endpoints}\nPosition: {order}"
location_on = "🟢 shown"
location_off = "⏸ hidden"
location_delete = "🗑 Delete this location? Inbounds and endpoints stay, without a location."
endpoints = "🔗 <b>Endpoints</b> · {inbound}\n\n🎯 direct · 🔀 relay · ☁️ CDN · 🟢 works · 🙈 hidden after failures · ⏸ disabled"
endpoints_empty = "🔗 <b>Endpoints</b> · {inbound}\n\nNone yet - add one, otherwise users get no link."
endpoint = "🔗 <b>Endpoint</b>\n\nType: {kind}\nProfile: {profile}\nAddress: <code>{address}</code>\nPort: {port}\nName: {remark}\nState: {state}\nError: {error}\n\nOverrides:\n<code>{overrides}</code>"
endpoint_hidden = "🙈 hidden (not responding)"
endpoint_delete = "🗑 Delete this endpoint? Users stop getting this link."
