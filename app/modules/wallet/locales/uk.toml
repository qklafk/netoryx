# Balance, top-ups and the operations history.

[wallet]
topup_button = "➕ Поповнити"
history_button = "📜 Історія операцій"
partner_button = "💼 Партнерський баланс"
cards_button = "💳 Збережені картки"

[wallet.balance]
title = "💰 <b>Ваш баланс: {balance}</b>"
partner = "💼 Партнерський баланс: <b>{balance}</b>"
hint = "З балансу можна оплатити підписку або подарунок другові. Коли автопродовження увімкнене, підписка продовжується сама, якщо на балансі вистачає коштів."

[wallet.topup]
text = "➕ <b>Поповнення балансу</b>\n\nОберіть суму або введіть свою — від {min} до {max} 👇"
custom = "✏️ Інша сума"
ask = "✏️ Введіть суму поповнення в рублях — від {min} до {max}.\n\nНаприклад: <code>500</code>"
invalid = "Не вдалося розпізнати суму 🤔 Надішліть ціле число рублів від {min} до {max}, наприклад <code>500</code>."
unavailable = "😔 Поповнення зараз недоступне. Загляньте трохи пізніше — або напишіть у підтримку."

[wallet.history]
title = "📜 <b>Історія операцій</b>"
item = "<b>{amount}</b> · {label}\n<i>{date}</i>"
empty = "📜 Операцій ще немає. Тут з’являтимуться поповнення, покупки та бонуси."
end = "📜 Більше операцій немає."
older = "Раніші ▶️"
newest = "◀️ Останні"

[wallet.tx]
payment = "💳 Поповнення"
purchase = "🛒 Оплата підписки"
gift_purchase = "🎁 Купівля подарунка"
referral_invitee = "🤝 Бонус за реєстрацію за запрошенням"
referral_inviter = "🤝 Бонус за запрошеного друга"
welcome_bonus = "👋 Вітальний бонус"
promo = "🎟 Промокод"
admin_adjust = "🛠 Коригування адміністратором"
refund = "↩️ Повернення"
referral_commission = "💼 Партнерська винагорода"
referral_transfer = "🔁 Переказ із партнерського балансу"
withdrawal = "📤 Виведення"
partner_account = "(партнерський баланс)"

[wallet.cards]
title = "💳 <b>Збережені картки</b>"
item = "• {title} — збережено {date}"
hint = "Якщо під час продовження підписки на балансі не вистачає коштів, недостачу спишуть з останньої використаної картки. З видалених карток кошти не списуються."
remove = "🗑 Видалити {title}"
removed = "Картку видалено"
empty = "💳 Збережених карток ще немає.\n\nЩоб додати картку, оплатіть підписку або поповнення карткою й оберіть «зберегти картку для автопродовження»."
off = "💳 Збережені картки зараз не використовуються в цьому магазині."
