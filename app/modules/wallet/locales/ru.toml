# Balance, top-ups and the operations history.

[wallet]
topup_button = "➕ Пополнить баланс"
history_button = "📜 История операций"
partner_button = "💼 Партнёрский баланс"
cards_button = "💳 Сохранённые карты"

[wallet.balance]
title = "💰 <b>Ваш баланс: {balance}</b>"
partner = "💼 Партнёрский баланс: <b>{balance}</b>"
hint = "Балансом можно оплатить подписку или подарок другу — а если включено автопродление, подписка продлится сама, когда на балансе хватит денег."

[wallet.topup]
text = "➕ <b>Пополнение баланса</b>\n\nВыберите сумму или введите свою — от {min} до {max} 👇"
custom = "✏️ Другая сумма"
ask = "✏️ Напишите сумму пополнения в рублях — от {min} до {max}.\n\nНапример: <code>500</code>"
invalid = "Не получилось разобрать сумму 🤔 Напишите целое число рублей от {min} до {max}, например <code>500</code>."
unavailable = "😔 Пополнение сейчас недоступно. Загляните чуть позже — или напишите в поддержку."

[wallet.history]
title = "📜 <b>История операций</b>"
item = "<b>{amount}</b> · {label}\n<i>{date}</i>"
empty = "📜 Операций пока не было. Здесь появятся пополнения, покупки и бонусы."
end = "📜 Больше операций нет."
older = "Раньше ▶️"
newest = "◀️ К последним"

[wallet.tx]
payment = "💳 Пополнение"
purchase = "🛒 Оплата подписки"
gift_purchase = "🎁 Покупка подарка"
referral_invitee = "🤝 Бонус за регистрацию по приглашению"
referral_inviter = "🤝 Бонус за приглашённого друга"
welcome_bonus = "👋 Приветственный бонус"
promo = "🎟 Промокод"
admin_adjust = "🛠 Корректировка от администратора"
refund = "↩️ Возврат"
referral_commission = "💼 Партнёрское вознаграждение"
referral_transfer = "🔁 Перевод с партнёрского баланса"
withdrawal = "📤 Вывод средств"
partner_account = "(партнёрский баланс)"

[wallet.cards]
title = "💳 <b>Сохранённые карты</b>"
item = "• {title} — сохранена {date}"
hint = "Если при продлении подписки на балансе не хватит денег, недостающая сумма спишется с последней использованной карты. Удалённые карты больше не списываются."
remove = "🗑 Удалить {title}"
removed = "Карта удалена"
empty = "💳 Сохранённых карт пока нет.\n\nЧтобы добавить карту, оплатите подписку или пополнение картой и выберите «сохранить карту для автопродления»."
off = "💳 Сохранённые карты сейчас не используются."
