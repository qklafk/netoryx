# "Мой налог" receipts: the buyer's message and admin notices.

[npd_receipts]
menu = "Чеки НПД"
receipt = "🧾 Чек за вашу оплату {amount}: <a href=\"{url}\">відкрити чек</a>"
auth_failed = "🧾 <b>Мой налог: вхід не виконано.</b>\nЧеки не реєструються, доки ви знову не ввійдете (веб-адмінка → Чеки НПД) або не виправите ІПН і пароль у налаштуваннях.\n<code>{error}</code>"
gave_up = "🧾 <b>Мой налог:</b> не вдалося зареєструвати чеків: {count}. Повторіть їх у веб-адмінці (Чеки НПД)."
