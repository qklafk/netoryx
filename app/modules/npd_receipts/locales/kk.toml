# "Мой налог" receipts: the buyer's message and admin notices.

[npd_receipts]
menu = "НПД түбіртектері"
receipt = "🧾 {amount} төлеміңіздің түбіртегі: <a href=\"{url}\">түбіртекті ашу</a>"
auth_failed = "🧾 <b>Мой налог: кіру орындалмаған.</b>\nҚайта кірмейінше (веб-әкімші → НПД түбіртектері) немесе баптауларда ЖСН мен құпиясөзді түзетпейінше түбіртектер тіркелмейді.\n<code>{error}</code>"
gave_up = "🧾 <b>Мой налог:</b> {count} түбіртекті тіркеу мүмкін болмады. Оларды веб-әкімшіде қайталаңыз (НПД түбіртектері)."
