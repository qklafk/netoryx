# Telegram proxy: the user screen and notices.

[tg_proxy]
title = "🛡 <b>Telegram 代理</b>"
intro = "即使在 Telegram 被限速或封锁的地方，也能保持流畅——无需 VPN，无需额外应用。\n\n点击「⚡️ 连接」，Telegram 会提示开启代理。几秒钟搞定！"
servers = "<b>您的服务器：</b>"
backup = "{title} · 备用"
pending = "⏳ 正在为您准备专属链接——通常不到一分钟。请稍后点击「🔄 刷新」。"
no_servers = "😔 目前没有可用的代理服务器。我们已知晓并会尽快修复——请稍后再来。"
limited_speed = "🐢 免费模式：速度最高 {mbps} Mbit/s。"
limited_ad = "📢 您的聊天列表中会出现一个赞助频道——代理因此得以免费。"
private_note = "🔒 此链接为您专属——请勿分享。如果有陌生人使用，我们会为您生成新链接。"
unavailable = "🛡 <b>Telegram 代理</b>\n\n代理暂不可用。请稍后再来 🙏"
no_subscription = "🛡 <b>Telegram 代理</b>\n\n代理随订阅提供。开通或续费订阅后，您的专属链接会立即出现在这里。"
qr = "📷 <b>{title}</b>\n\n用另一部手机的相机扫描此码——Telegram 会打开并提示连接代理。"
link_gone = "您的链接已变更——这是当前链接 👇"
rotate_confirm = "🔄 <b>获取新链接？</b>\n\n旧链接将在您添加过的所有设备上失效，需要重新连接代理。"
rotated = "✅ 新链接已准备好"
rotate_too_soon = "⏳ 链接最近刚更换过。{wait}后可获取新链接。"
faq = "❓ <b>工作原理</b>\n\n<b>这是什么？</b>专属 Telegram 代理：应用通过我们的服务器连接，因此即使 Telegram 被封锁或限速也能使用。\n\n<b>如何开启？</b>点击「⚡️ 连接」并在 Telegram 中确认。其他设备可扫描二维码或把链接发给自己。\n\n<b>需要 VPN 吗？</b>不需要。代理仅作用于 Telegram，不影响其他网络。\n\n<b>连不上？</b>试试备用服务器或获取新链接。\n\n<b>如何关闭？</b>Telegram 设置 → 数据和存储 → 代理。"
abuse_notice = "🛡 您的代理链接似乎被陌生人使用：同时有来自 {ips} 个地址的连接。\n\n我们已为您生成新链接，旧链接即将失效。请打开代理板块重新连接 👇"
admin_abuse = "🛡 Telegram 代理：用户 <code>{user_id}</code> 在 {server} 上的链接正被 {ips} 个 IP 使用。自动更换已关闭，或链接最近刚更换过。"
admin_abuse_rotated = "🛡 Telegram 代理：用户 <code>{user_id}</code> 在 {server} 上的链接曾被 {ips} 个 IP 使用——已生成新链接并通知用户。"
faq_socks = "<b>什么是 SOCKS5？</b> 第二种个人代理，带用户名和密码，适用于不支持 MTProto 的客户端。获取新链接时，SOCKS5 密码也会随之更换。"
socks_title = "🔌 <b>SOCKS5 代理</b>"
socks_intro = "适用于支持 SOCKS5 代理的应用和客户端的备选方案。在 Telegram 中点击“⚡️ SOCKS5”，或手动填写信息（设置 → 数据和存储 → 代理 → SOCKS5）。与代理之间的连接未加密，但您的 Telegram 消息仍然是端到端加密的。"
socks_server = "{title}"
socks_data = "服务器：<code>{server}</code>\n端口：<code>{port}</code>\n用户名：<code>{user}</code>\n密码：<code>{password}</code>"
socks_pending = "⏳ 正在为您准备 SOCKS5 账户，请稍后点击“🔄 刷新”。"
qr_socks = "📷 <b>SOCKS5 · {title}</b>\n\n用另一部手机的相机扫描此二维码，Telegram 会打开并提示连接代理。"

