faq_socks = "<b>SOCKS5 چیست؟</b> نوع دوم پراکسی شخصی با نام کاربری و گذرواژه، برای برنامه‌هایی که از MTProto پشتیبانی نمی‌کنند. با دریافت پیوند جدید، گذرواژه SOCKS5 هم عوض می‌شود."
