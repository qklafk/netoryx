socks_intro = "جایگزینی برای برنامه‌ها و کلاینت‌هایی که پراکسی SOCKS5 می‌پذیرند. در تلگرام «⚡️ SOCKS5» را بزنید یا اطلاعات را دستی وارد کنید (تنظیمات ← داده‌ها و حافظه ← پراکسی ← SOCKS5). اتصال به پراکسی رمزگذاری نمی‌شود، اما پیام‌های تلگرام شما همچنان رمزگذاری سرتاسری می‌مانند."
