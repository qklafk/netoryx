faq = "❓ <b>چطور کار می‌کند</b>\n\n<b>این چیست؟</b> یک پراکسی شخصی برای تلگرام: برنامه از طریق سرور ما وصل می‌شود، پس حتی وقتی تلگرام مسدود یا کند است کار می‌کند.\n\n<b>چطور روشنش کنم؟</b> «⚡️ اتصال» را بزنید و در تلگرام تأیید کنید. برای دستگاه دیگر، کد QR را اسکن کنید یا لینک را برای خودتان بفرستید.\n\n<b>به VPN نیاز دارم؟</b> نه. پراکسی فقط برای تلگرام کار می‌کند و به بقیهٔ اینترنت شما کاری ندارد.\n\n<b>وصل نمی‌شود؟</b> سرور پشتیبان را امتحان کنید یا لینک جدید بگیرید.\n\n<b>چطور خاموشش کنم؟</b> تنظیمات تلگرام ← داده و ذخیره‌سازی ← پراکسی."
abuse_notice = "🛡 به نظر می‌رسد افراد ناشناس از لینک پراکسی شما استفاده می‌کنند: اتصال‌ها هم‌زمان از {ips} آدرس آمده‌اند.\n\nبرای شما لینک جدیدی صادر کردیم؛ لینک قبلی به‌زودی از کار می‌افتد. بخش پراکسی را باز کنید و دوباره وصل شوید 👇"
