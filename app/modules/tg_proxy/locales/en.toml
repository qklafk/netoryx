# Telegram proxy: the user screen and notices.

[tg_proxy]
title = "🛡 <b>Telegram proxy</b>"
intro = "Telegram stays fast even where it is throttled or blocked — no VPN, no extra apps.\n\nTap “⚡️ Connect” and Telegram will offer to turn the proxy on. Done in a couple of seconds!"
servers = "<b>Your servers:</b>"
backup = "{title} · backup"
pending = "⏳ We are preparing your personal link — it usually takes less than a minute. Tap “🔄 Refresh” in a moment."
no_servers = "😔 No proxy servers are available right now. We know about it and will fix it soon — please check back later."
limited_speed = "🐢 Free plan: speed up to {mbps} Mbit/s."
limited_ad = "📢 A sponsor channel will appear in your chat list — it keeps the proxy free."
private_note = "🔒 This link is personal — please don't share it. If strangers start using it, we will issue a new one."
unavailable = "🛡 <b>Telegram proxy</b>\n\nThe proxy is not available right now. Please check back later 🙏"
no_subscription = "🛡 <b>Telegram proxy</b>\n\nThe proxy comes with a subscription. Get or renew one and your personal link will appear here right away."
qr = "📷 <b>{title}</b>\n\nScan this code with another phone's camera — Telegram will open and offer to connect the proxy."
link_gone = "Your link has changed — here is the current one 👇"
rotate_confirm = "🔄 <b>Get a new link?</b>\n\nThe old one will stop working on every device you added it to, so you will need to connect the proxy again."
rotated = "✅ Your new link is ready"
rotate_too_soon = "⏳ The link was changed recently. You can get a new one in {wait}."
faq = "❓ <b>How it works</b>\n\n<b>What is it?</b> A personal Telegram proxy: the app connects through our server, so it works even when Telegram is blocked or throttled.\n\n<b>How do I turn it on?</b> Tap “⚡️ Connect” and confirm in Telegram. For another device, scan the QR code or send yourself the link.\n\n<b>Do I need a VPN?</b> No. The proxy works for Telegram only and leaves the rest of your internet alone.\n\n<b>It doesn't connect?</b> Try the backup server or get a new link.\n\n<b>How do I turn it off?</b> Telegram Settings → Data and Storage → Proxy."
faq_socks = "<b>What is SOCKS5?</b> A second kind of personal proxy with a login and password, for clients that do not support MTProto. Getting a new link changes the SOCKS5 password too."
socks_title = "🔌 <b>SOCKS5 proxy</b>"
socks_intro = "An alternative for apps and clients that take a SOCKS5 proxy. In Telegram tap “⚡️ SOCKS5”, or enter the data by hand (Settings → Data and Storage → Proxy → SOCKS5). The connection to the proxy is not encrypted, but your Telegram messages stay end-to-end encrypted."
socks_server = "{title}"
socks_data = "Server: <code>{server}</code>\nPort: <code>{port}</code>\nLogin: <code>{user}</code>\nPassword: <code>{password}</code>"
socks_pending = "⏳ Your SOCKS5 account is being prepared — tap “🔄 Refresh” in a moment."
qr_socks = "📷 <b>SOCKS5 · {title}</b>\n\nScan this code with another phone's camera — Telegram will open and offer to connect the proxy."
abuse_notice = "🛡 It looks like strangers are using your proxy link: connections came from {ips} addresses at once.\n\nWe have issued a new link for you; the old one will stop working soon. Open the proxy section and connect again 👇"
admin_abuse = "🛡 Telegram proxy: the link of user <code>{user_id}</code> on {server} is used from {ips} IPs. Automatic replacement is off or the link was changed recently."
admin_abuse_rotated = "🛡 Telegram proxy: the link of user <code>{user_id}</code> on {server} was used from {ips} IPs — a new link was issued and the user was notified."

