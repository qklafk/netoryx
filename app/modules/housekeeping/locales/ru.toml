# Резервные копии и уборка: подписи и оповещения администраторам.

[housekeeping.backup]
caption = "💾 <b>Резервная копия {brand}</b>\n{when} · {size}"
encrypted = "🔒 Файл зашифрован паролем из настроек."
plain = "⚠️ Файл не зашифрован — храните его в надёжном месте или задайте пароль для копий в настройках."
failed = "😔 Не удалось создать резервную копию: <code>{error}</code>"
not_sent = "😔 Резервная копия <code>{name}</code> создана, но не отправилась в чат: <code>{error}</code>. Файл сохранён на сервере."

[housekeeping.unit]
b = "{n} Б"
kb = "{n} КБ"
mb = "{n} МБ"
gb = "{n} ГБ"
