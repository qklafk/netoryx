text_personal = "📖 <b>Довідка</b>\n\n<b>Як підключитися?</b>\nВідкрийте «📲 Підключити», оберіть пристрій і натисніть «➕ Додати» — застосунок налаштується сам.\n\n<b>VPN не працює?</b>\nОновіть підписку в застосунку, оберіть інший сервер або перезапустіть застосунок.\n\n<b>Мобільний інтернет із «білими списками»?</b>\nУвімкніть сервер із позначкою «LTE».\n\n<b>Новий телефон?</b>\nВідв’яжіть старий пристрій у «🔐 Моя підписка» → «📱 Пристрої»."

