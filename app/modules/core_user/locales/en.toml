[core_user.help]
text = "📖 <b>Help</b>\n\n<b>How do I connect?</b>\nOpen «📲 Connect», choose your device and tap «➕ Add» — the app sets itself up.\n\n<b>VPN not working?</b>\nUpdate the subscription in the app, pick another server or restart the app.\n\n<b>Mobile internet with «white lists»?</b>\nTurn on a server marked «LTE».\n\n<b>How many devices can I connect?</b>\nThe limit is shown in «🔐 My subscription». Got a new phone? Unlink the old device there.\n\n<b>How do I renew?</b>\nIn «🛒 Buy / renew»: the new term is added to the current one.\n\nStill have questions? Message support — we reply fast 💬"
text_personal = "📖 <b>Help</b>\n\n<b>How do I connect?</b>\nOpen «📲 Connect», choose your device and tap «➕ Add» — the app sets itself up.\n\n<b>VPN not working?</b>\nUpdate the subscription in the app, pick another server or restart the app.\n\n<b>Mobile internet with «white lists»?</b>\nTurn on a server marked «LTE».\n\n<b>Got a new phone?</b>\nUnlink the old device in «🔐 My subscription» → «📱 Devices»."

