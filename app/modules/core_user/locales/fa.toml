[core_user.help]
text = "📖 <b>راهنما</b>\n\n<b>چطور وصل شوم؟</b>\n«📲 اتصال» را باز کنید، دستگاه خود را انتخاب کنید و «➕ افزودن» را بزنید — برنامه خودش تنظیم می‌شود.\n\n<b>VPN کار نمی‌کند؟</b>\nاشتراک را در برنامه به‌روز کنید، سرور دیگری انتخاب کنید یا برنامه را دوباره باز کنید.\n\n<b>اینترنت همراه با «لیست سفید»؟</b>\nسروری با برچسب «LTE» را روشن کنید.\n\n<b>چند دستگاه می‌توانم وصل کنم؟</b>\nسقف آن در «🔐 اشتراک من» نمایش داده می‌شود. گوشی جدید گرفته‌اید؟ دستگاه قدیمی را همان‌جا جدا کنید.\n\n<b>چطور تمدید کنم؟</b>\nدر «🛒 خرید / تمدید»: مدت جدید به مدت فعلی اضافه می‌شود.\n\nسؤال دیگری دارید؟ به پشتیبانی پیام دهید — سریع پاسخ می‌دهیم 💬"
text_personal = "📖 <b>راهنما</b>\n\n<b>چطور وصل شوم؟</b>\n«📲 اتصال» را باز کنید، دستگاه خود را انتخاب کنید و «➕ افزودن» را بزنید — برنامه خودش تنظیم می‌شود.\n\n<b>VPN کار نمی‌کند؟</b>\nاشتراک را در برنامه به‌روز کنید، سرور دیگری انتخاب کنید یا برنامه را دوباره باز کنید.\n\n<b>اینترنت همراه با «لیست سفید»؟</b>\nسروری با برچسب «LTE» را روشن کنید.\n\n<b>گوشی جدید گرفته‌اید؟</b>\nدستگاه قدیمی را در «🔐 اشتراک من» ← «📱 دستگاه‌ها» جدا کنید."

