# Messages about payments and rewards, and notifications for administrators.

[paid]
topped_up = "✅ Балансыңыз <b>{amount}</b> сомаға толтырылды.\nАғымдағы баланс: <b>{balance}</b>."
plan_activated = "🎉 Рахмет! <b>{plan}</b> жазылымыңыз <b>{expires}</b> дейін белсенді.\n\nҚосылу сілтемесі басты мәзірде."
gift_ready = "🎁 Сыйлығыңыз дайын: <b>{plan}</b>.\n\nОсы сілтемені алушыға жіберіңіз:\n{link}\n\nНемесе код: <code>{code}</code>"
donation_thanks = "💜 Қолдауыңызға рахмет! Біз <b>{amount}</b> алдық."
plan_failed = "✅ <b>{amount}</b> төлеміңіз балансқа түсті (қазір <b>{balance}</b>), бірақ <b>{plan}</b> жазылымын автоматты түрде белсендіру мүмкін болмады.\n\nОны мәзірден баланс арқылы сатып алыңыз немесе қолдау қызметіне жазыңыз."
partial = "⚠️ <b>{expected}</b> орнына <b>{amount}</b> алынды. Сома балансқа есептелді, қазір онда <b>{balance}</b>."

[reward]
money = "💸 Рефералдық сыйақы: балансқа <b>+{amount}</b> ({level}-деңгей)."
partner = "💼 Серіктестік сыйақы: серіктес балансына <b>+{amount}</b> ({level}-деңгей)."
days = "🎁 Рефералдық бонус: жазылымыңызға <b>+{days}</b> қосылды ({level}-деңгей)."

[admin_notify]
payment = "💰 <b>{amount}</b>, {provider} арқылы\nПайдаланушы: <code>{user_id}</code> {username}\n{what}"
what_topup = "Балансты толтыру"
what_plan = "Сатып алу: {plan}"
what_gift = "Сыйлық: {plan}"
what_donation = "Қайырымдылық"
plan_failed = "⚠️ Жазылым белсендірілмеді: {reason}"
channel_check_failed = "⚠️ <code>{channel_id}</code> арнасына жазылымды тексеру мүмкін емес. Бот онда әкімші екеніне көз жеткізіңіз. Оған дейін пайдаланушылар тексерусіз өтеді."
error = "🔥 <b>Қате</b> <code>{signature}</code>\nupdate {update_id} ({update_type}), пайдаланушы <code>{user_id}</code>\n<code>{error}</code>\n<pre>{trace}</pre>"
