[project]
name = "vpn-bot"
version = "0.9.0b0"
description = "Self-hosted Telegram bot for selling VPN subscriptions on 3x-ui and Remnawave: plans, trials, multi-server, Happ/INCY subscriptions, Stars/CryptoBot/Platega/YooKassa payments, web admin and Mini App"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.31,<4",
    "sqlalchemy[asyncio]>=2.1,<3",
    "aiosqlite>=0.22",
    "alembic>=1.20",
    "apscheduler>=3.11,<4",
    "pydantic-settings>=2.16",
    "qrcode[pil]>=8.2",
    "fastapi>=0.120",
    "uvicorn[standard]>=0.38",
    "cryptography>=46",
    "asyncpg>=0.30",
    "aiomysql>=0.3",
    "aiohttp-socks>=0.12.0",
    "filelock>=4.2,<5",
]

[project.optional-dependencies]
redis = ["redis>=8"]
sentry = [
    "sentry-sdk>=2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1",
    "ruff>=0.14",
    "mypy>=1.18",
    "pytest-cov>=7.1.0",
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
    "testcontainers>=4",
    "httpx>=0.28.1",
    "pytest-timeout>=2.4.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# A hanging test fails instead of blocking the run; slow integration tests raise it with @pytest.mark.timeout.
timeout = 60

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Cyrillic text is intentional

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]
