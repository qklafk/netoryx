# One public TLS port for everything. HAProxy reads only the SNI of the TLS ClientHello and passes the connection on
# untouched: names listed in sni.map go to the VPN or the Telegram proxy, everything else to Caddy (web admin, Mini
# App, subscription links). Only Caddy receives the client address (PROXY protocol, used for rate limits); nothing is
# logged per connection.
global
    log stdout format raw local0 warning

defaults
    mode tcp
    log global
    timeout connect 10s
    timeout client 1h
    timeout server 1h

frontend tls_in
    bind :443
    # Wait for the whole ClientHello: modern clients send post-quantum key shares that span several TCP segments,
    # and the server name is only readable once the hello is complete.
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.ssl_sni -m found }
    tcp-request content accept if WAIT_END
    use_backend %[req.ssl_sni,lower,map(/usr/local/etc/haproxy/sni.map,web)] if { req.ssl_sni -m found }
    default_backend web

backend web
    server caddy caddy:443 send-proxy-v2 init-addr last,libc,none resolvers docker

# Reality inbound of the panel: REALITY_HOST and REALITY_PORT come from the environment (3x-ui runs on the host network,
# the other panels run in the same Docker network and are reached by their container name).
backend reality
    server xray "${REALITY_HOST}:${REALITY_PORT}" init-addr last,libc,none resolvers docker

# Optional telemt Telegram proxy.
backend tgproxy
    server telemt telemt:993 init-addr last,libc,none resolvers docker

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 10s
